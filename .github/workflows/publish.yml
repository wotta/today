name: Auto-publish to Chrome Web Store and Firefox Add-ons

on:
  schedule:
    - cron: "17 * * * *"   # hourly, offset to avoid top-of-hour congestion
  workflow_dispatch:        # allow manual trigger from the Actions tab

concurrency:
  group: publish-chrome
  cancel-in-progress: false

jobs:
  publish:
    name: Publish if repo version is newer than store
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Read target version from package.json
        id: target
        run: |
          RAW=$(node -p "require('./apps/extension/package.json').version")
          # Chrome manifest versions are numeric-only; strip any pre-release suffix (-alpha etc).
          NORM=$(printf '%s' "$RAW" | grep -oP '^[0-9]+(\.[0-9]+){0,3}')
          echo "raw=$RAW"   >> "$GITHUB_OUTPUT"
          echo "version=$NORM" >> "$GITHUB_OUTPUT"
          echo "Target: $RAW -> $NORM"

      - name: Read published (draft) version from Chrome Web Store
        id: store_chrome
        env:
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
        run: |
          TOKEN=$(curl -s -X POST 'https://oauth2.googleapis.com/token' \
            -d client_id="$CHROME_CLIENT_ID" \
            -d client_secret="$CHROME_CLIENT_SECRET" \
            -d refresh_token="$CHROME_REFRESH_TOKEN" \
            -d grant_type=refresh_token | grep -oP '"access_token":\s*"\K[^"]+')
          if [ -z "$TOKEN" ]; then echo "::error::failed to get access token"; exit 1; fi
          RESP=$(curl -s -H "Authorization: Bearer $TOKEN" -H "x-goog-api-version: 2" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/${CHROME_EXTENSION_ID}?projection=DRAFT")
          LIVE=$(printf '%s' "$RESP" | grep -oP '"crxVersion":\s*"\K[^"]+')
          echo "store crxVersion: $LIVE"
          echo "version=$LIVE" >> "$GITHUB_OUTPUT"

      - name: Read current version from Firefox Add-ons
        id: store_firefox
        env:
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
        run: |
          RESP=$(curl -s "https://addons.mozilla.org/api/v5/addons/addon/${FIREFOX_EXTENSION_ID}/")
          LIVE=$(printf '%s' "$RESP" | grep -oP '"version":\s*"\K[^"]+' | head -1)
          echo "AMO version: $LIVE"
          echo "version=$LIVE" >> "$GITHUB_OUTPUT"

      - name: Decide whether to publish Chrome
        id: decide_chrome
        run: |
          T="${{ steps.target.outputs.version }}"
          S="${{ steps.store_chrome.outputs.version }}"
          if [ -z "$T" ]; then echo "::error::could not parse target version"; exit 1; fi
          if [ "$T" != "$S" ] && [ "$(printf '%s\n%s\n' "$T" "$S" | sort -V | tail -1)" = "$T" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Chrome: repo $T > store $S -> will publish"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Chrome: repo $T vs store $S -> nothing to do"
          fi

      - name: Decide whether to publish Firefox
        id: decide_firefox
        run: |
          T="${{ steps.target.outputs.version }}"
          S="${{ steps.store_firefox.outputs.version }}"
          if [ "$T" != "$S" ] && [ "$(printf '%s\n%s\n' "$T" "$S" | sort -V | tail -1)" = "$T" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Firefox: repo $T > AMO $S -> will publish"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Firefox: repo $T vs AMO $S -> nothing to do"
          fi

      - name: Install dependencies
        if: steps.decide_chrome.outputs.publish == 'true' || steps.decide_firefox.outputs.publish == 'true'
        run: bun install --frozen-lockfile

      - name: Build & zip Chrome (production)
        if: steps.decide_chrome.outputs.publish == 'true'
        working-directory: apps/extension
        run: bun run zip:store

      - name: Build & zip Firefox
        if: steps.decide_firefox.outputs.publish == 'true'
        working-directory: apps/extension
        run: bun run zip:firefox

      - name: Submit to Chrome Web Store
        if: steps.decide_chrome.outputs.publish == 'true'
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CHROME_PUBLISH_TARGET: ${{ secrets.CHROME_PUBLISH_TARGET }}
        working-directory: apps/extension
        run: bunx wxt submit --chrome-zip .output/*-chrome.zip

      - name: Submit to Firefox Add-ons
        if: steps.decide_firefox.outputs.publish == 'true'
        env:
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        working-directory: apps/extension
        run: |
          bunx wxt submit \
            --firefox-zip .output/*-firefox.zip \
            --firefox-sources-zip .output/*-sources.zip \
            --firefox-extension-id "$FIREFOX_EXTENSION_ID" \
            --firefox-jwt-issuer "$FIREFOX_JWT_ISSUER" \
            --firefox-jwt-secret "$FIREFOX_JWT_SECRET"
